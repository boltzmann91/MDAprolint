[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MDAprolint"
version = "0.5.0"
description = "A fast python package that uses MDAnalysis and its openmp backend to calculate lipid-protein interactions, lipid-protein distances, and lipid residence times. Based on the principles of Prolint."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "MDAnalysis>=2.0.0",
    "pandas",
    "numpy",
    "matplotlib",
    "scipy"
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/boltzmann91/MDAprolint"
Issues = "https://github.com/boltzmann91/MDAprolint/issues"
